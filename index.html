<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Web Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main id="welcome-screen">
    <div class="card-stack">
        <div class="welcome-card card-red-4">4</div>
        <div class="welcome-card card-green-plus2">+2</div>
        <div class="welcome-card card-yellow-9">9</div>
        <div class="welcome-card card-blue-wild">W</div>
    </div>
    <div class="welcome-content">
        <h1>UNO</h1>
    </div>
    <div class="welcome-buttons">
        <button id="singleplayer-btn" class="welcome-button">Singleplayer</button>
        <button id="multiplayer-btn" class="welcome-button">Multiplayer</button>
        <div id="multiplayer-options" class="hidden">
            <label for="player-count">Cantidad de jugadores:</label>
            <input type="number" id="player-count" min="2" max="6" value="2" style="width: 50px;">
            <button id="start-multiplayer-btn" class="welcome-button">Jugar</button>
        </div>
    </div>
</main>

<div id="player-setup-modal" class="hidden modal-bg">
    <div class="modal">
        <h2>Configura los jugadores</h2>
        <form id="player-setup-form">
            <div id="player-inputs"></div>
            <button type="submit" class="welcome-button">Comenzar partida</button>
            <button type="button" id="cancel-setup" class="welcome-button">Cancelar</button>
        </form>
    </div>
</div>

<main id="game-board" class="hidden">
    
    <section class="player-area" id="opponent-area">
        
    </section>

    <section class="center-area">
        <div id="deck" class="card-pile">
            <span id="deck-count" class="deck-count"></span>
        </div>
        <div id="discard-pile" class="card-pile"></div>
    </section>

    <section class="player-area" id="player-area">
        <div class="player-info">
            <span id="player-name"></span>
            <button id="uno-btn" class="uno-btn">UNO</button>
        </div>
    </section>
</main>

<div id="color-selector" class="hidden"></div>

<script src="script.js"></script>
</body>
</html>
